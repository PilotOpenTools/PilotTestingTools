name: Предложение
description: Идея или запрос новой функции
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить
      description: Опишите ситуацию, в которой сейчас неудобно или невозможно.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
